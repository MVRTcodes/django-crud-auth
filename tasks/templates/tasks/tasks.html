{% extends 'base.html' %}

{% block content %}

<h1>Tasks</h1>

{% for task in tasks%}
<article>
    <li><a href="{% url 'task_detail' task.id %}">
        {% if task.important %}<strong>{{task.title}}</strong>
        {% else %} {{task.title}}
        {% endif %}</a></li>
</article>
{% endfor %}

{% endblock %}
